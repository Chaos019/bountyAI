services:
  - type: web
    name: bountyai
    runtime: python
    buildCommand: >
      curl -sL https://github.com/projectdiscovery/nuclei/releases/download/v3.1.1/nuclei_3.1.1_linux_amd64.zip -o /tmp/nuclei.zip &&
      unzip -o /tmp/nuclei.zip nuclei -d BountyAI_v3_Project/bountyai/server/ &&
      chmod +x BountyAI_v3_Project/bountyai/server/nuclei &&
      rm /tmp/nuclei.zip
    startCommand: python BountyAI_v3_Project/bountyai/server/server.py
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
    healthCheckPath: /api/health
