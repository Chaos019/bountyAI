# BountyAI v3 — single stdlib-Python service backed by SQLite (bountyai.db).
# Postgres/Redis services removed: nothing in server.py uses them.
# NOTE: DB_PATH and .env are resolved relative to server/, so this file must
#       be run from the project root:  docker compose up
services:
  web:
    build: .
    image: bountyai_web
    container_name: bountyai_web
    ports:
      - "5000:5000"
    env_file:
      - ./bountyai/.env
    restart: always
