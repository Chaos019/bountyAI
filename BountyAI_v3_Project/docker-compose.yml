version: "3.9"

services:
  web:
    build: .
    image: bountyai_web
    container_name: bountyai_web
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:15-alpine
    container_name: bountyai_db
    environment:
      POSTGRES_USER: bountyai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bountyai
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: bountyai_redis
    restart: always

volumes:
  pgdata:
